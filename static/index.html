<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Voice Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; background: #fafafa; color: #111; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { color: #555; margin: 0 0 20px; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  button { font-size: 16px; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; }
  #startBtn { background: #16a34a; color: #fff; }
  #endBtn { background: #dc2626; color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  #status { font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  #transcript { min-height: 180px; max-height: 320px; overflow-y: auto; }
  .line { margin: 0 0 8px; line-height: 1.45; }
  .line b { color: #166534; }
  .line.agent b { color: #1d4ed8; }
  .doctor { margin-bottom: 14px; }
  .doctor b { display: block; }
  .doctor span { color: #555; font-size: 14px; }
  .slots { margin-top: 4px; font-size: 14px; }
  .slots code { background: #f0f0f0; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .appt { margin: 0 0 8px; line-height: 1.45; }
  .empty { color: #777; }
</style>
</head>
<body>
<h1>Clinic Voice Agent</h1>
<p class="sub">Talk to the agent to check availability, book, or cancel an appointment. The agent identifies you only by the phone number you speak.</p>
<div class="row">
  <button id="startBtn">Start call</button>
  <button id="endBtn" disabled>End call</button>
  <span id="status">Idle</span>
</div>
<audio id="remoteAudio" autoplay></audio>
<div class="grid">
  <div class="card">
    <h2>Live transcript</h2>
    <div id="transcript"><p class="empty">No conversation yet.</p></div>
  </div>
  <div class="card">
    <h2>Doctors and slots</h2>
    <div id="doctors"><p class="empty">Loading.</p></div>
    <h2 style="margin-top: 20px;">Appointments</h2>
    <div id="appointments"><p class="empty">No appointments yet.</p></div>
  </div>
</div>
<script>
let pc = null;
let localStream = null;
let lastLineCount = 0;

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const endBtn = document.getElementById('endBtn');

function setStatus(text) {
  statusEl.textContent = text;
}

function waitGathering(connection) {
  return new Promise((resolve) => {
    if (connection.iceGatheringState === 'complete') {
      resolve();
      return;
    }
    connection.onicegatheringstatechange = () => {
      if (connection.iceGatheringState === 'complete') {
        resolve();
      }
    };
  });
}

async function startCall() {
  startBtn.disabled = true;
  setStatus('Requesting microphone.');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus('Microphone blocked. Allow mic access and try again.');
    startBtn.disabled = false;
    return;
  }
  pc = new RTCPeerConnection();
  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
  pc.ontrack = (event) => {
    document.getElementById('remoteAudio').srcObject = event.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus('Connected. Speak now.');
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      setStatus('Connection ' + pc.connectionState + '.');
    }
  };
  setStatus('Calling.');
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitGathering(pc);
  const res = await fetch('/offer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  const answer = await res.json();
  await pc.setRemoteDescription(answer);
  endBtn.disabled = false;
}

function endCall() {
  if (pc) {
    pc.close();
    pc = null;
  }
  if (localStream) {
    localStream.getTracks().forEach((track) => track.stop());
    localStream = null;
  }
  startBtn.disabled = false;
  endBtn.disabled = true;
  setStatus('Call ended.');
}

async function refreshTranscript() {
  const res = await fetch('/api/transcript');
  const data = await res.json();
  if (data.lines.length === lastLineCount) {
    return;
  }
  lastLineCount = data.lines.length;
  const box = document.getElementById('transcript');
  if (data.lines.length === 0) {
    box.innerHTML = '<p class="empty">No conversation yet.</p>';
    return;
  }
  box.innerHTML = data.lines.map((line) => {
    const who = line.who === 'agent' ? 'Agent' : 'You';
    return '<p class="line ' + line.who + '"><b>' + who + ':</b> ' + line.text + '</p>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function refreshDoctors() {
  const res = await fetch('/api/doctors');
  const data = await res.json();
  const box = document.getElementById('doctors');
  box.innerHTML = data.doctors.map((doctor) => {
    const days = Object.entries(doctor.slots).map(([day, times]) => {
      return day + ': ' + times.map((t) => '<code>' + t + '</code>').join('');
    }).join('<br>');
    return '<div class="doctor"><b>' + doctor.doctor + '</b><span>' + doctor.speciality + '</span><div class="slots">' + days + '</div></div>';
  }).join('');
}

async function refreshAppointments() {
  const res = await fetch('/api/appointments');
  const data = await res.json();
  const box = document.getElementById('appointments');
  if (data.appointments.length === 0) {
    box.innerHTML = '<p class="empty">No appointments yet.</p>';
    return;
  }
  box.innerHTML = data.appointments.map((appt) => {
    return '<p class="appt">' + appt.doctor + ' on ' + appt.date + ' at ' + appt.time + '<br><span style="color:#555">Phone: ' + appt.phone + '</span></p>';
  }).join('');
}

startBtn.addEventListener('click', startCall);
endBtn.addEventListener('click', endCall);
refreshDoctors();
refreshAppointments();
setInterval(refreshTranscript, 1000);
setInterval(refreshAppointments, 2000);
setInterval(refreshDoctors, 10000);
</script>
</body>
</html>
